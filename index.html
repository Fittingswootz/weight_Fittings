const $=id=>document.getElementById(id);
const cat=$('category'),type=$('type'),cls=$('class'),sch=$('schedule'),size=$('size');
function uniq(xs){return [...new Set(xs.filter(v=>v!==null&&v!==undefined&&v!==''))]}
function sortSizes(vals){
  const toNum=s=>{
    s=String(s).trim().replace(/-/g,' ');
    if(s.includes('x')) return s.split('x').map(toNum)[0];
    let m=s.match(/^(\d+)(?:\s+(\d+)\/(\d+))?$/);
    if(m) return +m[1]+(m[2]?+m[2]/+m[3]:0);
    m=s.match(/^(\d+)\/(\d+)$/); if(m) return +m[1]/+m[2];
    return parseFloat(s)||9999;
  };
  return [...vals].sort((a,b)=>toNum(a)-toNum(b)||String(a).localeCompare(String(b)));
}
function sortSchedules(vals){
  const order={'5':5,'5S':6,'10':10,'10S':11,'20':20,'30':30,'STD':35,'40':40,'40S':41,'60':60,'XS':70,'80':80,'80S':81,'100':100,'120':120,'140':140,'160':160,'XX':200};
  return [...vals].sort((a,b)=>(order[a]??999)-(order[b]??999)||String(a).localeCompare(String(b)));
}
function setOpts(el,vals,placeholder){el.innerHTML=`<option value="">${placeholder}</option>`+vals.map(v=>`<option value="${String(v).replaceAll('"','&quot;')}">${v}</option>`).join('');el.disabled=!vals.length}
function resetResult(){$('result').style.display='none';$('empty').style.display='none';$('pipeNote').style.display='none'}
function getOptions(p){
  if(p.category==='flanges'){
    const classes=Object.keys(DATA.flanges);
    const all=classes.flatMap(c=>DATA.flanges[c]);
    if(!p.type&&!p.class) return {types:uniq(all.map(r=>r.type)),classes};
    const rows=(p.class?DATA.flanges[p.class]||[]:all).filter(r=>!p.type||r.type===p.type);
    return {sizes:sortSizes(uniq(rows.map(r=>r.size))),types:uniq(rows.map(r=>r.type)),classes};
  }
  if(p.category==='buttweld'){
    const types=Object.keys(DATA.buttweld);
    if(!p.type) return {types};
    let rows=DATA.buttweld[p.type]||[];
    if(!p.schedule) return {schedules:sortSchedules(uniq(rows.map(r=>r.schedule)))};
    rows=rows.filter(r=>r.schedule===p.schedule);
    return {sizes:sortSizes(uniq(rows.map(r=>r.size)))};
  }
  if(p.category==='pipe'){
    if(!p.schedule) return {schedules:sortSchedules(uniq(DATA.pipe.flatMap(r=>r.schedules||[])))};
    const rows=DATA.pipe.filter(r=>(r.schedules||[]).includes(p.schedule));
    return {sizes:sortSizes(uniq(rows.map(r=>r.size)))};
  }
  return {};
}
function lookup(q){
  if(q.category==='flanges'){
    const row=(DATA.flanges[q.class]||[]).find(r=>r.type===q.type&&r.size===q.size);
    if(!row) throw new Error('No value is listed in the provided PDF for this combination.');
    return {weight:row.weight,weight_unit:'kg/pc'};
  }
  if(q.category==='buttweld'){
    const row=(DATA.buttweld[q.type]||[]).find(r=>r.schedule===q.schedule&&r.size===q.size);
    if(!row) throw new Error('No value is listed in the provided PDF for this combination.');
    return {weight:row.weight,weight_unit:'kg/pc'};
  }
  if(q.category==='pipe'){
    const row=DATA.pipe.find(r=>r.size===q.size&&(r.schedules||[]).includes(q.schedule));
    if(!row) throw new Error('No value is listed in the provided PDF for this combination.');
    return {weight:row.weight,weight_unit:'kg/m',dn:row.dn,wall_thickness:{inch:row.wall_in,mm:row.wall_mm},od:{inch:row.od_in,mm:row.od_mm},id:{inch:row.id_in,mm:row.id_mm}};
  }
  throw new Error('Invalid category.');
}
cat.onchange=()=>{resetResult();setOpts(type,[],'Select type');setOpts(size,[],'Select size');setOpts(sch,[],'Select schedule');setOpts(cls,[],'Select class');$('classField').style.display='none';$('scheduleField').style.display='none';$('typeField').style.display='flex';if(!cat.value)return;const o=getOptions({category:cat.value});if(cat.value==='flanges'){setOpts(type,o.types||[],'Select type');$('classField').style.display='flex';setOpts(cls,o.classes||[],'Select class')}else if(cat.value==='buttweld'){setOpts(type,o.types||[],'Select type');$('scheduleField').style.display='flex'}else{$('typeField').style.display='none';$('scheduleField').style.display='flex';setOpts(sch,o.schedules||[],'Select schedule')}};
type.onchange=()=>{resetResult();setOpts(size,[],'Select size');if(cat.value==='flanges'){if(type.value&&cls.value){let o=getOptions({category:'flanges',type:type.value,class:cls.value});setOpts(size,o.sizes||[],'Select size')}}else if(cat.value==='buttweld'){if(!type.value)return setOpts(sch,[],'Select schedule');let o=getOptions({category:'buttweld',type:type.value});setOpts(sch,o.schedules||[],'Select schedule')}};
cls.onchange=()=>{resetResult();setOpts(size,[],'Select size');if(type.value&&cls.value){let o=getOptions({category:'flanges',type:type.value,class:cls.value});setOpts(size,o.sizes||[],'Select size')}};
sch.onchange=()=>{resetResult();setOpts(size,[],'Select size');if(!sch.value)return;if(cat.value==='buttweld'&&type.value){let o=getOptions({category:'buttweld',type:type.value,schedule:sch.value});setOpts(size,o.sizes||[],'Select size')}else if(cat.value==='pipe'){let o=getOptions({category:'pipe',schedule:sch.value});setOpts(size,o.sizes||[],'Select size')}};
function fmt(v,d=2){if(v===null||v===undefined)return '—';return Number(v).toFixed(d).replace(/\.00$/,'')}
size.onchange=()=>{resetResult();if(!size.value)return;let q={category:cat.value,size:size.value,material:'SS'};if(type.value)q.type=type.value;if(cls.value)q.class=cls.value;if(sch.value)q.schedule=sch.value;try{let row=lookup(q);$('result').style.display='block';if(cat.value==='pipe'){$('simpleResult').style.display='none';$('pipeResult').style.display='grid';$('pipeWeight').textContent=`${fmt(row.weight)} ${row.weight_unit}`;$('pipeWall').textContent=`${fmt(row.wall_thickness.inch,3)} in / ${fmt(row.wall_thickness.mm)} mm`;$('pipeOD').textContent=`${fmt(row.od.inch,3)} in / ${fmt(row.od.mm)} mm`;$('pipeID').textContent=`${fmt(row.id.inch,3)} in / ${fmt(row.id.mm)} mm`;$('pipeDN').textContent=row.dn?`DN ${row.dn}`:'—';$('pipeNote').style.display='block'}else{$('pipeResult').style.display='none';$('simpleResult').style.display='block';$('weight').textContent=`${row.weight} ${row.weight_unit}`}}catch(e){$('empty').textContent=e.message;$('empty').style.display='block'}};
